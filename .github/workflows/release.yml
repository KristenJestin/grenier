# The version of Grenier, decided by what was merged.
#
# `package.json` stays at 0.0.0 and nobody edits a version by hand: the tag semantic-release
# puts on a branch is the version. No plugin here writes a commit, so the history of a branch is
# what was merged into it and nothing the pipeline added afterwards.
#
# Only `main` publishes: merging `dev` into `main` (a merge commit, never a squash) publishes
# `vX.Y.Z`, read from the subjects of the squashed pull requests it brings. `dev` publishes
# nothing: it is the integration branch. Grenier starts in `0.x`. Breaking changes move the minor: a
# 2.0 is a decision, not something a commit message brings about.

name: release

on:
  push:
    branches: [main]
  # A dry run of the viewer's build on a tag that exists: nothing is tagged, both archives are
  # attached to that tag's release.
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag to build the viewer from, such as v0.4.0'
        required: true

# One release at a time per branch, in the order of the pushes: two tags are never computed
# from the same history.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        if: github.event_name == 'push'
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
        if: github.event_name == 'push'
      - name: Tag what was merged, and write the release notes
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx semantic-release
      # The tag semantic-release just put on this commit, if it made one; or the one asked for.
      - name: The tag to build the viewer from
        id: tag
        env:
          ASKED: ${{ inputs.tag }}
        run: |
          if [ -n "$ASKED" ]; then tag=$ASKED; else tag=$(git tag --points-at HEAD --list 'v*' | head -n 1); fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # The desktop viewer, built from the tag on Linux and on Windows, attached to its release with a
  # checksum each. No tag, nothing built.
  desktop:
    needs: release
    if: needs.release.outputs.tag != ''
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      # What GPUI needs on Linux to build the desktop app (as in ci.yml).
      - name: Install the libraries of the desktop app
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libwayland-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libssl-dev libzstd-dev libasound2-dev libvulkan1
      # rustup installs the Rust of rust-toolchain.toml.
      - name: Build the viewer, which takes its version from the tag
        run: GRENIER_VERSION="${TAG#v}" cargo build --locked --release -p app
      - name: Pack it with its checksum
        id: pack
        run: echo "archive=$(scripts/package.sh "${TAG#v}" ${{ matrix.platform }})" >> "$GITHUB_OUTPUT"
      - name: Attach both to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHIVE: ${{ steps.pack.outputs.archive }}
        run: gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber
