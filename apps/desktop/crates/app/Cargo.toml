[package]
name = "app"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# The binary the releases carry, run as `grenier-desktop`.
[[bin]]
name = "grenier-desktop"
path = "src/main.rs"

[dependencies]
api = { path = "../api" }
# Where the configuration lives on each system.
dirs = "=6.0.0"
gpui-kit.workspace = true
serde.workspace = true
serde_json.workspace = true
ui = { path = "../ui" }
# The read API over HTTP: small and blocking, run on GPUI's background executor.
ureq = { version = "=3.4.2", features = ["json"] }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
