[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
# GPUI Kit: GPUI, its behaviour layer and its styled components, one pinned dependency.
gpui-kit = "=0.7.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
